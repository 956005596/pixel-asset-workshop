name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Check offline rendering and local automation
        run: npm test
        env:
          PIXEL_WORKSHOP_BROWSER: /usr/bin/google-chrome
